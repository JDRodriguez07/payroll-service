spring.application.name=payroll-service

# ===============================
# Database Configuration
# ===============================

# MySQL connection values are injected through environment variables.
spring.datasource.url=jdbc:mysql://${DB_HOST:payroll_db}:${DB_PORT:3306}/${DB_NAME:db_payroll_service}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:payroll_service_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Mostrar las consultas SQL en los logs
spring.jpa.show-sql=true

# ===============================
# Server Configuration
# ===============================
server.port=${SERVER_PORT:8080}

# Springdoc Configuration
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui


api.user-management.base-url=${USER_MANAGEMENT_BASE_URL:http://backend-usermanagment:8080}
